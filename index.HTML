<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HH Timeclock</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ff8c00'/><circle cx='50' cy='50' r='5' fill='white'/><line x1='50' y1='50' x2='50' y2='20' stroke='white' stroke-width='3'/><line x1='50' y1='50' x2='70' y2='50' stroke='white' stroke-width='3'/></svg>">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ReplayTimer() {
      const [timers, setTimers] = useState([]);
      const [gameTime, setGameTime] = useState(0);
      const [isGameTimePaused, setIsGameTimePaused] = useState(true);
      const [isFirstHalf, setIsFirstHalf] = useState(true);
      const [tags, setTags] = useState([]);
      const [showTagInput, setShowTagInput] = useState(false);
      const [tagNote, setTagNote] = useState('');
      const [taggedTime, setTaggedTime] = useState(0);
      const [taggedRealTime, setTaggedRealTime] = useState(null);
      const [showKeyGuide, setShowKeyGuide] = useState(false);
      const [showTimeOverride, setShowTimeOverride] = useState(false);
      const [overrideTime, setOverrideTime] = useState('');
      const [realTime, setRealTime] = useState(new Date());
      const [isInverted, setIsInverted] = useState(false);
      const [isSoloMode, setIsSoloMode] = useState(false);
      const [showLocalTime, setShowLocalTime] = useState(true);
      const [localTimeZone, setLocalTimeZone] = useState(Intl.DateTimeFormat().resolvedOptions().timeZone);
      const [showTimezoneSelect, setShowTimezoneSelect] = useState(false);
      const nextId = useRef(0);
      const gameTimeStartRef = useRef(null);
      const gameTimeAtStart = useRef(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setRealTime(new Date());
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (!isGameTimePaused && gameTimeStartRef.current !== null) {
          const interval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - gameTimeStartRef.current) / 1000);
            const newTime = gameTimeAtStart.current + elapsed;
            
            const maxTime = isFirstHalf ? 100 * 60 : 200 * 60;
            if (newTime >= maxTime) {
              setGameTime(maxTime);
              setIsGameTimePaused(true);
              gameTimeStartRef.current = null;
            } else {
              setGameTime(newTime);
            }
          }, 1000);
          return () => clearInterval(interval);
        }
      }, [isGameTimePaused, isFirstHalf]);

      useEffect(() => {
        const handleKeyPress = (e) => {
          // CTRL + K for start/continue
          if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
            e.preventDefault();
            if (isGameTimePaused) {
              setIsGameTimePaused(false);
              gameTimeStartRef.current = Date.now();
              gameTimeAtStart.current = gameTime;
            }
            return;
          }

          // CTRL + L for pause
          if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
            e.preventDefault();
            setIsGameTimePaused(true);
            gameTimeStartRef.current = null;
            return;
          }

          // CTRL + [ for reset to 0
          if ((e.ctrlKey || e.metaKey) && e.key === '[') {
            e.preventDefault();
            setGameTime(0);
            setIsFirstHalf(true);
            if (!isGameTimePaused) {
              gameTimeStartRef.current = Date.now();
              gameTimeAtStart.current = 0;
            }
            return;
          }

          // CTRL + ] for jump to 45
          if ((e.ctrlKey || e.metaKey) && e.key === ']') {
            e.preventDefault();
            setGameTime(45 * 60);
            setIsFirstHalf(false);
            if (!isGameTimePaused) {
              gameTimeStartRef.current = Date.now();
              gameTimeAtStart.current = 45 * 60;
            }
            return;
          }

          // CTRL + T for tagging
          if ((e.ctrlKey || e.metaKey) && (e.key === 't' || e.key === 'T')) {
            e.preventDefault();
            setTaggedTime(gameTime);
            setTaggedRealTime(new Date());
            setShowTagInput(true);
            return;
          }

          // Only allow timer controls if not in solo mode
          if (!isSoloMode) {
            // CTRL + C for clear main timer
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
              e.preventDefault();
              if (timers.length > 0) {
                setTimers(prev => prev.slice(1));
              }
              return;
            }

            // CTRL + V for clear all timers
            if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
              e.preventDefault();
              setTimers([]);
              return;
            }

            // CTRL + = or + for start timer
            if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
              e.preventDefault();
              const newTimer = {
                id: nextId.current++,
                startTime: Date.now(),
                duration: 23000,
                phase: 'running'
              };
              setTimers(prev => [...prev, newTimer]);
              return;
            }
          }

          // CTRL + , for back 10s
          if ((e.ctrlKey || e.metaKey) && e.key === ',') {
            e.preventDefault();
            const newTime = Math.max(0, gameTime - 10);
            setGameTime(newTime);
            if (!isGameTimePaused) {
              gameTimeStartRef.current = Date.now();
              gameTimeAtStart.current = newTime;
            }
            return;
          }

          // CTRL + . for forward 10s
          if ((e.ctrlKey || e.metaKey) && e.key === '.') {
            e.preventDefault();
            const maxTime = isFirstHalf ? 100 * 60 : 200 * 60;
            const newTime = Math.min(maxTime, gameTime + 10);
            setGameTime(newTime);
            if (!isGameTimePaused) {
              gameTimeStartRef.current = Date.now();
              gameTimeAtStart.current = newTime;
            }
            return;
          }

          // CTRL + ? for time override
          if ((e.ctrlKey || e.metaKey) && e.key === '?') {
            e.preventDefault();
            setShowTimeOverride(true);
            return;
          }
        };
        
        window.addEventListener('keydown', handleKeyPress);
        return () => window.removeEventListener('keydown', handleKeyPress);
      }, [isFirstHalf, gameTime, isGameTimePaused, timers.length, isSoloMode]);

      useEffect(() => {
        if (!isSoloMode) {
          const interval = setInterval(() => {
            const now = Date.now();
            setTimers(prev => {
              return prev
                .map(timer => {
                  const elapsed = now - timer.startTime;
                  const remaining = timer.duration - elapsed;
                  if (timer.phase === 'running' && remaining <= 0) {
                    return { ...timer, phase: 'expiring', expiryTime: now };
                  }
                  if (timer.phase === 'expiring' && now - timer.expiryTime >= 1000) {
                    return null;
                  }
                  return timer;
                })
                .filter(Boolean);
            });
          }, 100);
          return () => clearInterval(interval);
        }
      }, [isSoloMode]);

      const getTimeRemaining = (timer) => {
        if (!timer) return 0;
        if (timer.phase === 'expiring') return 0;
        const elapsed = Date.now() - timer.startTime;
        return Math.max(0, Math.ceil((timer.duration - elapsed) / 1000));
      };

      const formatGameTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      };

      const formatRealTime = (date, timezone) => {
        return date.toLocaleTimeString('en-GB', { 
          timeZone: timezone,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      };

      const handleAddTag = () => {
        if (tagNote.trim()) {
          setTags(prev => [...prev, { 
            time: taggedTime, 
            note: tagNote, 
            id: Date.now(),
            ukTime: taggedRealTime,
            localTime: taggedRealTime
          }]);
          setTagNote('');
        }
        setShowTagInput(false);
      };

      const handleTimeOverride = () => {
        const parts = overrideTime.split(':');
        if (parts.length === 2) {
          const mins = parseInt(parts[0]);
          const secs = parseInt(parts[1]);
          if (!isNaN(mins) && !isNaN(secs)) {
            const newTime = mins * 60 + secs;
            const maxTime = isFirstHalf ? 100 * 60 : 200 * 60;
            if (newTime >= 0 && newTime <= maxTime) {
              setGameTime(newTime);
              if (!isGameTimePaused) {
                gameTimeStartRef.current = Date.now();
                gameTimeAtStart.current = newTime;
              }
            }
          }
        }
        setOverrideTime('');
        setShowTimeOverride(false);
      };

      const exportTags = () => {
        if (tags.length === 0) {
          alert('No tags to export');
          return;
        }

        let content = 'Exported from HH Timeclock software: Game times may vary or not be accurate due to manual triggering. All timestamps for notes are at time of trigger.\n\n';
        content += 'Note - this is vibe coded and in no way is this a polished piece of software. I\'m not smart lol\n\n';
        content += '='.repeat(100) + '\n\n';
        
        if (showLocalTime) {
          content += 'UK Time\t\t\tLocal Time\t\tGame Time\tNote\n';
        } else {
          content += 'UK Time\t\t\tGame Time\tNote\n';
        }
        content += '-'.repeat(100) + '\n';
        
        tags.forEach(tag => {
          const ukTime = tag.ukTime.toLocaleString('en-GB', { 
            timeZone: 'Europe/London',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
          
          if (showLocalTime) {
            const localTime = tag.localTime.toLocaleString('en-GB', { 
              timeZone: localTimeZone,
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });
            content += `${ukTime}\t\t${localTime}\t\t${formatGameTime(tag.time)}\t\t${tag.note}\n`;
          } else {
            content += `${ukTime}\t\t${formatGameTime(tag.time)}\t\t${tag.note}\n`;
          }
        });

        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `game-tags-${new Date().toISOString().slice(0,10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const commonTimezones = [
        'Europe/London',
        'America/New_York',
        'America/Chicago',
        'America/Los_Angeles',
        'Europe/Paris',
        'Europe/Berlin',
        'Asia/Dubai',
        'Asia/Tokyo',
        'Australia/Sydney',
        'Pacific/Auckland'
      ];

      const mainTimer = timers[0];
      const upcomingTimers = timers.slice(1);
      const mainTimeRemaining = mainTimer ? getTimeRemaining(mainTimer) : 0;
      const isMainUrgent = mainTimeRemaining <= 5 && mainTimeRemaining > 0;
      const isMainExpired = mainTimer && mainTimer.phase === 'expiring';

      const sidebarContent = (
        <div className="bg-gray-700 p-8 flex flex-col gap-4 overflow-y-auto h-screen">
          <div className="bg-gray-800 rounded-lg p-3 mb-2 flex justify-between items-center">
            <div className="text-gray-400 text-sm">UK Time</div>
            <div className="text-orange-500 text-xl font-mono font-bold">
              {formatRealTime(realTime, 'Europe/London')}
            </div>
          </div>

          {showLocalTime && (
            <div className="bg-gray-800 rounded-lg p-3 mb-2">
              <div className="flex justify-between items-center">
                <div className="text-gray-400 text-sm">Local Time</div>
                <button
                  onClick={() => setShowTimezoneSelect(!showTimezoneSelect)}
                  className="text-orange-500 text-xl font-mono font-bold hover:text-orange-400"
                >
                  {formatRealTime(realTime, localTimeZone)}
                </button>
              </div>
              {showTimezoneSelect && (
                <div className="mt-2 max-h-40 overflow-y-auto bg-gray-900 rounded">
                  {commonTimezones.map(tz => (
                    <div
                      key={tz}
                      onClick={() => {
                        setLocalTimeZone(tz);
                        setShowTimezoneSelect(false);
                      }}
                      className="p-2 hover:bg-gray-700 cursor-pointer text-sm text-gray-300"
                    >
                      {tz}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <div className="bg-gray-800 rounded-lg p-6 mb-4">
            <div className="text-gray-400 text-xl font-medium mb-2">Game Time</div>
            <div className="text-orange-500 text-5xl font-mono font-bold">
              {formatGameTime(gameTime)}
            </div>
            <div className="text-gray-500 text-sm mt-2">
              {isFirstHalf ? 'First Half' : 'Second Half'} • {isGameTimePaused ? 'Paused' : 'Running'}
            </div>
            <div className="text-gray-500 text-xs mt-3">
              Press Ctrl+K to {isGameTimePaused ? 'start/continue' : 'running...'}
            </div>
          </div>

          <div className="flex gap-2 mb-2 flex-wrap">
            <button
              onClick={() => {
                setIsSoloMode(!isSoloMode);
                if (!isSoloMode) {
                  setTimers([]);
                }
              }}
              className={`${isSoloMode ? 'bg-orange-600' : 'bg-orange-500'} hover:bg-orange-600 text-white px-3 py-1 rounded text-sm transition-colors font-bold`}
            >
              {isSoloMode ? '✓ Solo Mode' : 'Solo Mode'}
            </button>
            {!isSoloMode && (
              <button
                onClick={() => setIsInverted(!isInverted)}
                className="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded text-sm transition-colors"
              >
                {isInverted ? 'Timer Right' : 'Timer Left'}
              </button>
            )}
            {isSoloMode && (
              <button
                onClick={() => setShowLocalTime(!showLocalTime)}
                className="bg-gray-800 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded text-sm transition-colors"
              >
                {showLocalTime ? 'Hide Local' : 'Show Local'}
              </button>
            )}
            <button
              onClick={() => setShowKeyGuide(!showKeyGuide)}
              className="bg-gray-800 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded text-sm transition-colors"
            >
              {showKeyGuide ? 'Hide' : 'Show'} Keys
            </button>
            <button
              onClick={exportTags}
              className="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded text-sm transition-colors"
            >
              Export
            </button>
          </div>

          {showKeyGuide && (
            <div className="bg-gray-800 rounded-lg p-4 mb-2 text-sm">
              <div className="text-orange-500 font-bold mb-3">Keyboard Commands</div>
              <div className="space-y-2 text-gray-300">
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+K</span> - Start/continue</div>
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+L</span> - Pause</div>
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+[</span> - Set 00:00</div>
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+]</span> - Set 45:00</div>
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+T</span> - Tag time</div>
                {!isSoloMode && (
                  <>
                    <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+C</span> - Clear main timer</div>
                    <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+V</span> - Clear all timers</div>
                    <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+=</span> - Start 23s timer</div>
                  </>
                )}
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+,</span> - Back 10s</div>
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+.</span> - Forward 10s</div>
                <div><span className="font-mono bg-gray-700 px-2 py-1 rounded">Ctrl+?</span> - Set time</div>
              </div>
            </div>
          )}

          {showTagInput && (
            <div className="bg-gray-800 rounded-lg p-4 mb-4 border-2 border-orange-500">
              <div className="text-orange-500 text-lg font-medium mb-2">
                Tag at {formatGameTime(taggedTime)}
              </div>
              <input
                type="text"
                value={tagNote}
                onChange={(e) => setTagNote(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') handleAddTag();
                  if (e.key === 'Escape') setShowTagInput(false);
                }}
                placeholder="Enter note..."
                className="w-full bg-gray-700 text-white px-3 py-2 rounded mb-2"
                autoFocus
              />
              <div className="flex gap-2">
                <button
                  onClick={handleAddTag}
                  className="bg-orange-500 text-white px-4 py-1 rounded text-sm"
                >
                  Add
                </button>
                <button
                  onClick={() => setShowTagInput(false)}
                  className="bg-gray-600 text-white px-4 py-1 rounded text-sm"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {showTimeOverride && (
            <div className="bg-gray-800 rounded-lg p-4 mb-4 border-2 border-orange-500">
              <div className="text-orange-500 text-lg font-medium mb-2">
                Set Game Time
              </div>
              <input
                type="text"
                value={overrideTime}
                onChange={(e) => setOverrideTime(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') handleTimeOverride();
                  if (e.key === 'Escape') setShowTimeOverride(false);
                }}
                placeholder="MM:SS (e.g. 23:45)"
                className="w-full bg-gray-700 text-white px-3 py-2 rounded mb-2"
                autoFocus
              />
              <div className="flex gap-2">
                <button
                  onClick={handleTimeOverride}
                  className="bg-orange-500 text-white px-4 py-1 rounded text-sm"
                >
                  Set
                </button>
                <button
                  onClick={() => setShowTimeOverride(false)}
                  className="bg-gray-600 text-white px-4 py-1 rounded text-sm"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {!isSoloMode && upcomingTimers.length > 0 && (
            <>
              <div className="text-gray-400 text-2xl font-medium">Upcoming</div>
              {upcomingTimers.map(timer => {
                const timeRemaining = getTimeRemaining(timer);
                const isExpired = timer.phase === 'expiring';
                const isRed = timeRemaining <= 5;

                return (
                  <div
                    key={timer.id}
                    className="bg-gray-800 rounded-lg p-6 flex items-center justify-center"
                  >
                    <div
                      className={`font-mono font-bold text-6xl ${
                        isExpired
                          ? 'text-red-500 animate-pulse'
                          : isRed
                            ? 'text-red-500'
                            : 'text-orange-500'
                      }`}
                    >
                      {isExpired ? '0' : timeRemaining}
                    </div>
                  </div>
                );
              })}
            </>
          )}

          {tags.length > 0 && (
            <div className="mb-4">
              <div className="text-gray-400 text-xl font-medium mb-3">Tags</div>
              <div className="flex flex-col gap-2">
                {tags.map(tag => (
                  <div key={tag.id} className="bg-gray-800 rounded-lg p-3">
                    <div className="text-orange-500 font-mono font-bold text-lg">
                      {formatGameTime(tag.time)}
                    </div>
                    <div className="text-gray-300 text-sm mt-1">{tag.note}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );

      const mainTimerDisplay = (
        <div className="flex-1 flex items-center justify-center bg-gray-800">
          {!mainTimer ? (
            <div className="text-gray-500 text-3xl font-medium">
              {isSoloMode ? 'Solo Operator Mode' : 'Press Ctrl+= to start a timer'}
            </div>
          ) : (
            <div
              className={`font-mono font-bold leading-none ${
                isMainExpired
                  ? 'text-red-500 animate-pulse'
                  : mainTimeRemaining <= 5
                    ? 'text-red-500'
                    : 'text-orange-500'
              }`}
              style={{ fontSize: '50vw' }}
            >
              {isMainExpired ? '0' : mainTimeRemaining}
            </div>
          )}
        </div>
      );

      if (isSoloMode) {
        return (
          <div className="flex min-h-screen bg-gray-800">
            <div className="w-full">
              {sidebarContent}
            </div>
          </div>
        );
      }

      return (
        <div className="flex min-h-screen bg-gray-800">
          {isInverted ? (
            <>
              {mainTimerDisplay}
              <div className="w-1/3">
                {sidebarContent}
              </div>
            </>
          ) : (
            <>
              <div className="w-1/3">
                {sidebarContent}
              </div>
              {mainTimerDisplay}
            </>
          )}
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReplayTimer />);
  </script>
</body>
</html>
