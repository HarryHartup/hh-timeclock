<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HH Timeclock</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ff8c00'/><circle cx='50' cy='50' r='5' fill='white'/><line x1='50' y1='50' x2='50' y2='20' stroke='white' stroke-width='3'/><line x1='50' y1='50' x2='70' y2='50' stroke='white' stroke-width='3'/></svg>">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #1f2937; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ReplayTimer({ switchMode }) {
      const [gameTime, setGameTime] = useState(0);
      const [isGameTimePaused, setIsGameTimePaused] = useState(true);
      const [realTime, setRealTime] = useState(new Date());

      useEffect(() => {
        const interval = setInterval(() => setRealTime(new Date()), 1000);
        return () => clearInterval(interval);
      }, []);

      const formatGameTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, '0')}`;
      };

      return (
        <div className="flex flex-col min-h-screen bg-gray-800">
          <header className="bg-gray-900 p-4 flex justify-between items-center">
            <h1 className="text-2xl font-bold text-orange-500">HH Timeclock - Replay Timer</h1>
            <button
              onClick={() => switchMode('solo')}
              className="bg-orange-500 hover:bg-orange-600 px-3 py-1 rounded text-white text-sm"
            >
              Switch to Solo Operator
            </button>
          </header>
          <div className="flex-1 flex flex-col items-center justify-center text-gray-400">
            <p className="text-5xl text-orange-500 font-mono font-bold">{formatGameTime(gameTime)}</p>
            <p className="text-gray-400 mt-2 text-sm">{realTime.toLocaleTimeString()}</p>
          </div>
        </div>
      );
    }

    function SoloOperator({ switchMode }) {
      const [tags, setTags] = useState([]);
      const [tagNote, setTagNote] = useState('');
      const [gameTime, setGameTime] = useState(0);
      const [isPaused, setIsPaused] = useState(true);
      const [realTime, setRealTime] = useState(new Date());
      const [enableLocalTime, setEnableLocalTime] = useState(false);
      const localTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const gameTimeStartRef = useRef(null);
      const gameTimeAtStart = useRef(0);

      useEffect(() => {
        const interval = setInterval(() => setRealTime(new Date()), 1000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (!isPaused && gameTimeStartRef.current !== null) {
          const interval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - gameTimeStartRef.current) / 1000);
            setGameTime(gameTimeAtStart.current + elapsed);
          }, 1000);
          return () => clearInterval(interval);
        }
      }, [isPaused]);

      const formatGameTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, '0')}`;
      };

      const addTag = () => {
        if (!tagNote.trim()) return;
        const newTag = {
          id: Date.now(),
          time: gameTime,
          note: tagNote,
          ukTime: new Date(),
          localTime: enableLocalTime ? new Date() : null,
        };
        setTags((t) => [...t, newTag]);
        setTagNote('');
      };

      const exportTags = () => {
        if (tags.length === 0) return alert('No tags to export');
        let content = 'UK Time\tLocal Time\tGame Time\tNote\n';
        tags.forEach((t) => {
          const uk = t.ukTime.toLocaleTimeString('en-GB', { timeZone: 'Europe/London' });
          const local = t.localTime ? t.localTime.toLocaleTimeString('en-GB', { timeZone: localTimeZone }) : '-';
          content += `${uk}\t${local}\t${formatGameTime(t.time)}\t${t.note}\n`;
        });
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'solo-tags.txt';
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="flex flex-col min-h-screen bg-gray-800">
          <header className="bg-gray-900 p-4 flex justify-between items-center">
            <h1 className="text-2xl font-bold text-orange-500">HH Timeclock - Solo Operator</h1>
            <button
              onClick={() => switchMode('replay')}
              className="bg-orange-500 hover:bg-orange-600 px-3 py-1 rounded text-white text-sm"
            >
              Back to Replay Timer
            </button>
          </header>
          <main className="flex-1 p-6 flex flex-col gap-6">
            <div className="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700">
              <div>
                <div className="text-gray-400 text-sm">Game Time</div>
                <div className="text-orange-500 text-5xl font-mono font-bold">{formatGameTime(gameTime)}</div>
              </div>
              <div className="text-right">
                <div className="text-gray-400 text-sm">UK Time</div>
                <div className="text-orange-500 text-2xl font-mono font-bold">
                  {realTime.toLocaleTimeString('en-GB', { timeZone: 'Europe/London' })}
                </div>
                {enableLocalTime && (
                  <div className="text-gray-400 text-sm mt-2">
                    Local: {realTime.toLocaleTimeString('en-GB', { timeZone: localTimeZone })}
                  </div>
                )}
              </div>
            </div>

            <div className="flex gap-2">
              <button
                onClick={() => {
                  if (isPaused) {
                    setIsPaused(false);
                    gameTimeStartRef.current = Date.now();
                    gameTimeAtStart.current = gameTime;
                  } else {
                    setIsPaused(true);
                    gameTimeStartRef.current = null;
                  }
                }}
                className="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded text-white"
              >
                {isPaused ? 'Start' : 'Pause'}
              </button>
              <button
                onClick={() => setGameTime(0)}
                className="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded text-white"
              >
                Reset
              </button>
              <button
                onClick={exportTags}
                className="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded text-white"
              >
                Export Tags
              </button>
              <button
                onClick={() => setEnableLocalTime(!enableLocalTime)}
                className={`px-4 py-2 rounded text-white ${enableLocalTime ? 'bg-green-600' : 'bg-gray-600'}`}
              >
                {enableLocalTime ? 'Local Time: ON' : 'Local Time: OFF'}
              </button>
            </div>

            <div className="bg-gray-900 p-4 rounded-lg">
              <input
                type="text"
                value={tagNote}
                onChange={(e) => setTagNote(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && addTag()}
                placeholder="Enter note..."
                className="w-full bg-gray-700 text-white px-3 py-2 rounded mb-2"
              />
              <button
                onClick={addTag}
                className="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded text-white"
              >
                Add Tag
              </button>
            </div>

            {tags.length > 0 && (
              <div className="bg-gray-900 p-4 rounded-lg">
                <h2 className="text-orange-500 text-xl mb-3 font-bold">Tags</h2>
                <div className="flex flex-col gap-2">
                  {tags.map((t) => (
                    <div key={t.id} className="bg-gray-800 p-3 rounded border border-gray-700">
                      <div className="text-orange-500 font-mono text-lg">{formatGameTime(t.time)}</div>
                      <div className="text-gray-400 text-sm">
                        {t.ukTime.toLocaleTimeString('en-GB', { timeZone: 'Europe/London' })}
                        {enableLocalTime && t.localTime && (
                          <span> • Local: {t.localTime.toLocaleTimeString('en-GB', { timeZone: localTimeZone })}</span>
                        )}
                      </div>
                      <div className="text-white mt-1">{t.note}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    function App() {
      const [mode, setMode] = useState('replay');
      return mode === 'replay' ? <ReplayTimer switchMode={setMode} /> : <SoloOperator switchMode={setMode} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
